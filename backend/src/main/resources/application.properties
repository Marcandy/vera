spring.application.name=vera-api

# H2 in memory for the vertical slice. No install, no container, and the schema
# is rebuilt on every start, which is what makes the CommandLineRunner seed the
# single source of demo data. Postgres replaces this with a real URL and
# ddl-auto=validate plus a migration tool.
spring.datasource.url=jdbc:h2:mem:vera;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Timestamps go out as ISO-8601 strings, never as epoch numbers. The exact
# pattern is pinned on the DTO; this stops Jackson defaulting to a number for
# anything that is not annotated.
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=8080

# Empty in development because Vite proxies /api and there is no cross origin
# request to allow. Set to the deployed frontend origin in production.
vera.cors.allowed-origins=
